<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span id="gameName">…</span> <span class="badge" id="demoBadge">DEMO</span></div>
  <div class="lang" role="group" aria-label="Language">
    <button id="langRu" data-lang="ru" type="button">RU</button><button id="langEn" data-lang="en" type="button">EN</button>
  </div>
</header>
<p class="disclaimer" id="disclaimer"></p>
<main class="layout">
  <section class="stage">
    <div class="hud" id="hud"></div>
    <div class="canvasWrap">
      <canvas id="scene" width="960" height="540" aria-label="Game scene"></canvas>
      <div class="sceneHint" id="sceneHint"></div>
      <button id="eggPrompt" class="eggPrompt hidden" type="button"></button>
    </div>
    <div class="actions">
      <button id="collectBtn" class="collect" type="button"></button>
      <button id="autoBtn" class="auto" type="button"></button>
    </div>
    <div class="hint" id="collectHint"></div>
  </section>
  <section class="side">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="panel" id="panel"></div>
  </section>
</main>
<footer class="foot"><span id="footerGen"></span> <span id="footerLinks"></span></footer>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
